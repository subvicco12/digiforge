# Review template only. Public routes and workers.dev are disabled.
# Required private service bindings are intentionally absent.
name = "digiforge-protected-read-review"
main = "worker.mjs"
compatibility_date = "2026-11-24"
workers_dev = false
preview_urls = false

[vars]
EXECUTION_MODE = "held"

[[durable_objects.bindings]]
name = "ADMISSION"
class_name = "ProtectedReadAdmission"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ProtectedReadAdmission"]
