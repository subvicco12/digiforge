# Held review template. Private witness binding and bootstrap are intentionally absent.
name = "digiforge-t4-policy"
main = "policy-service.mjs"
compatibility_date = "2026-11-24"
workers_dev = false
preview_urls = false

[vars]
MODE = "held"
T4_PRIVATE_ROLE = "policy"
T4_SCOPE_DIGEST = ""

[[durable_objects.bindings]]
name = "POLICY"
class_name = "PolicyAdmission"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PolicyAdmission"]
