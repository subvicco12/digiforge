name: DigiForge Cloudflare Metadata Inventory (PROPOSAL DISABLED)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digiforge-cloudflare-inventory
  cancel-in-progress: false

jobs:
  inventory:
    # SECURITY_BLOCKED: branch protection and credential scope remain unqualified.
    # Removing this literal requires a NEW separately reviewed/approved revision.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cloudflare-inventory-readonly
    steps:
      - name: Verify approved revision before retrieving any client code
        env:
          EXECUTION_APPROVAL: ${{ vars.DIGIFORGE_CF_EXECUTION_APPROVAL }}
          APPROVED_SHA: ${{ vars.DIGIFORGE_CF_INVENTORY_APPROVED_SHA }}
          APPROVED_CLIENT_SHA256: d17360d05e17887e927f46e6f1d1209017713bf4fb4e0b155b0e9b1c4764beb8
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          CURRENT_SHA: ${{ github.sha }}
          CURRENT_REF: ${{ github.ref }}
          CURRENT_REPO: ${{ github.repository }}
          CURRENT_EVENT: ${{ github.event_name }}
          CURRENT_RUN_NUMBER: ${{ github.run_number }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          APPROVED_RUN_NUMBER: ${{ vars.DIGIFORGE_CF_INVENTORY_APPROVED_RUN_NUMBER }}
          GH_CONTENTS_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +x
          python3 -I - <<'PY'
          import base64, hashlib, http.client, json, os, pathlib, re, ssl, sys
          try:
              approved_run = os.environ['APPROVED_RUN_NUMBER']
              assert re.fullmatch(r'[1-9][0-9]{0,9}', approved_run)
              assert os.environ['CURRENT_RUN_NUMBER'] == approved_run
              assert os.environ['CURRENT_RUN_ATTEMPT'] == '1'
              sha = os.environ['APPROVED_SHA']
              expected = os.environ['APPROVED_CLIENT_SHA256']
              branch = 'refs/heads/cloudflare-inventory-execution'
              workflow = 'subvicco12/digiforge/.github/workflows/cloudflare-account-inventory.yml@' + branch
              assert os.environ['EXECUTION_APPROVAL'] == 'OWNER_APPROVED_METADATA_ONLY_V2_ONE_RUN'
              assert re.fullmatch(r'[a-f0-9]{40}', sha) and re.fullmatch(r'[a-f0-9]{64}', expected)
              assert os.environ['CURRENT_REPO'] == 'subvicco12/digiforge'
              assert os.environ['CURRENT_EVENT'] == 'workflow_dispatch'
              assert os.environ['CURRENT_REF'] == branch and os.environ['WORKFLOW_REF'] == workflow
              assert os.environ['CURRENT_SHA'] == sha and os.environ['WORKFLOW_SHA'] == sha
              conn = http.client.HTTPSConnection('api.github.com', timeout=10, context=ssl.create_default_context())
              path = '/repos/subvicco12/digiforge/contents/bin/cloudflare-inventory/client.py?ref=' + sha
              conn.request('GET', path, headers={'Authorization': 'Bearer ' + os.environ.pop('GH_CONTENTS_TOKEN'), 'Accept': 'application/vnd.github+json', 'User-Agent': 'DigiForge-inventory-admission'})
              response = conn.getresponse()
              data = response.read(200001)
              assert response.status == 200 and len(data) <= 200000
              conn.close()
              payload = json.loads(data)
              assert payload['encoding'] == 'base64' and payload['type'] == 'file'
              raw = base64.b64decode(payload['content'].replace('\n', ''), validate=True)
              assert len(raw) <= 65536 and hashlib.sha256(raw).hexdigest() == expected
              directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'digiforge-cf-inventory'
              directory.mkdir(mode=0o700)
              fd = os.open(directory / 'verified-client.py', os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
              with os.fdopen(fd, 'wb') as stream:
                  stream.write(raw)
              print('APPROVED_SOURCE_VERIFIED')
          except Exception:
              print('ADMISSION_DENIED')
              sys.exit(1)
          PY

      - name: Execute only bounded checksum-verified GET metadata client
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPROVED_CLIENT_SHA256: d17360d05e17887e927f46e6f1d1209017713bf4fb4e0b155b0e9b1c4764beb8
          DIGIFORGE_CF_ACCOUNT_ID: ${{ vars.DIGIFORGE_CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set +x
          python3 -I - <<'PY'
          import hashlib, os, pathlib, re, stat, sys
          try:
              expected = os.environ['APPROVED_CLIENT_SHA256']
              assert re.fullmatch(r'[a-f0-9]{64}', expected)
              path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'digiforge-cf-inventory' / 'verified-client.py'
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
              with os.fdopen(fd, 'rb') as stream:
                  st = os.fstat(stream.fileno())
                  assert stat.S_ISREG(st.st_mode) and st.st_uid == os.geteuid() and not st.st_mode & 0o077
                  raw = stream.read(65537)
              assert len(raw) <= 65536 and hashlib.sha256(raw).hexdigest() == expected
              # Hashing and execution use the SAME bounded bytes, with no reopen.
              code = compile(raw, '<verified-inventory-client>', 'exec')
          except Exception:
              print('VERIFIED_CLIENT_DENIED')
              sys.exit(1)
          exec(code, {'__name__': '__main__', '__file__': str(path)})
          PY

      - name: Summarize only minimized verification observations
        shell: bash
        run: |
          set +x
          python3 -I - <<'PYCODE'
          import json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'digiforge-cf-inventory' / 'report.json'
          report = json.loads(p.read_text())
          print('READ_ONLY_VERIFICATION_COMPLETE')
          print('WORKERS_SCRIPTS_WRITE_UNVERIFIED')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('GET-only token check; write permissions and exclusive account restriction remain UNVERIFIED.\n')
              connection=report['connection']
              assert connection in ('TOKEN_NOT_QUALIFIED','ACCOUNT_DISCOVERY_UNAVAILABLE','ACCOUNT_SELECTION_REQUIRED','ACCOUNT_UNAVAILABLE','SCOPED_INVENTORY_OBSERVED','PARTIAL_INVENTORY')
              out.write(f"CONNECTION: {connection}; TARGET_ACCOUNT_SELECTED: {'selected_account_fingerprint' in report}\n")
              token=report['operations'][0].get('token_status', 'UNVERIFIED')
              assert token in ('active','disabled','expired','UNVERIFIED')
              out.write(f"TOKEN_STATUS: {token}\n")
              for row in report['operations']:
                  assert row['operation'] in ('TOKEN_VERIFY','ACCOUNTS','SETTINGS','WORKERS','NAMESPACES','WORKFLOWS','ENTITLEMENTS')
                  assert row['state'] in ('UNKNOWN','OBSERVED','BUDGET_EXHAUSTED','RATE_LIMITED','UNAUTHORIZED','FORBIDDEN','NOT_FOUND','REDIRECT_DENIED','PROVIDER_ERROR','MALFORMED','API_ERROR','OVERSIZED','TIMEOUT','TRANSPORT_ERROR','SKIPPED_RATE_LIMIT','SKIPPED_UNAUTHORIZED')
                  status=row.get('http_status')
                  assert status is None or type(status) is int and 100 <= status <= 599
                  count=row.get('observed_count')
                  assert count is None or type(count) is int and 0 <= count <= 10000
                  out.write(f"{row['operation']}: {row['state']}; HTTP={status}; count={count}\n")
          PYCODE
