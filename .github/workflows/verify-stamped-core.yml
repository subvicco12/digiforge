name: Verify stamped Core package

on:
  workflow_dispatch:
    inputs:
      approve_packaging:
        description: Approve this isolated package verification
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  verify:
    if: >-
      inputs.approve_packaging &&
      github.repository == 'subvicco12/digiforge' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'subvicco12' &&
      github.triggering_actor == 'subvicco12' &&
      github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CORE_SHA: 2c9fcca6e14fbf64f94414661d42d85715039070
      CORE_ZIP_SHA256: c73990c595f7086d1b1bbf77dabae8288717faaea9aa60041d7bf5050d7a3524
      CORE_STAMP_SHA256: b06ad4959429685f54ff5fc754eefa9c80e09b096a2b35c67af6b017e25e67a9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CORE_SHA }}
          persist-credentials: false
      - name: Build and verify the pinned package
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$CORE_SHA"
          python3 bin/package-native-printify-ports.py "$RUNNER_TEMP/core-package"
          python3 - "$RUNNER_TEMP/core-package" <<'PY'
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import zipfile

          output = Path(sys.argv[1])
          source = os.environ["CORE_SHA"]
          archive = "digiforge-native-ports-offline.zip"
          prefix = "digiforge/"
          stamp_path = "includes/Connector/Printify/native-build.json"

          def digest(data):
              return hashlib.sha256(data).hexdigest()

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          committed = subprocess.check_output(
              ["git", "archive", "--format=zip", "--prefix=digiforge/", source]
          )
          archive_bytes = (output / archive).read_bytes()
          zip_hash = digest(archive_bytes)
          require(zip_hash == os.environ["CORE_ZIP_SHA256"], "Core ZIP digest mismatch")

          with zipfile.ZipFile(io.BytesIO(committed)) as plain, zipfile.ZipFile(io.BytesIO(archive_bytes)) as stamped:
              members = plain.namelist()
              require(stamped.testzip() is None, "ZIP integrity failure")
              require(len(members) == len(set(members)), "Duplicate source archive members")
              require(stamped.namelist() == members + [prefix + stamp_path], "Unexpected ZIP members")
              for name in members:
                  require(
                      plain.read(name) == stamped.read(name)
                      and (plain.getinfo(name).external_attr or (0o600 << 16))
                      == stamped.getinfo(name).external_attr,
                      f"Source bytes or mode differ for {name}",
                  )
              stamp_bytes = stamped.read(prefix + stamp_path)
              stamp_hash = digest(stamp_bytes)
              require(stamp_hash == os.environ["CORE_STAMP_SHA256"], "Core build-stamp digest mismatch")
              stamp = json.loads(stamp_bytes)
              require(stamp["schema"] == "DF_NATIVE_BUILD_1" and stamp["source_sha"] == source, "Stamp identity mismatch")
              for name, expected in stamp["files"].items():
                  require(name != stamp_path and digest(plain.read(prefix + name)) == expected, f"Stamp member mismatch: {name}")
              inventory = {
                  name: {"sha256": digest(stamped.read(name)), "bytes": stamped.getinfo(name).file_size}
                  for name in stamped.namelist() if not name.endswith("/")
              }

          manifest = json.loads((output / "source-to-artifact.json").read_bytes())
          require(
              manifest["schema"] == "DF_NATIVE_OFFLINE_ARTIFACT_1"
              and manifest["source_sha"] == source
              and manifest["artifact"] == archive
              and manifest["artifact_sha256"] == zip_hash
              and manifest["canonical_git_archive_sha256"] == digest(committed)
              and manifest["spec_sha256"] == stamp["spec_sha256"]
              and manifest["files"] == inventory
              and manifest["external_execution_authorized"] is False,
              "Package manifest mismatch",
          )
          require((output / (archive + ".sha256")).read_text() == f"{zip_hash}  {archive}\n", "Checksum file mismatch")
          receipt = {
              "source_sha": source,
              "workflow_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "zip_sha256": zip_hash,
              "build_stamp_sha256": stamp_hash,
              "manifest_sha256": digest((output / "source-to-artifact.json").read_bytes()),
          }
          (output / "verification.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-stamped-core-${{ env.CORE_SHA }}
          path: ${{ runner.temp }}/core-package/
          if-no-files-found: error
          retention-days: 7
