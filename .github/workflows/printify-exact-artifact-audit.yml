name: Printify exact-artifact audit (approval gated)
on:
  workflow_dispatch:
    inputs:
      intake_run_id:
        description: Approved same-repository successful intake run ID
        required: true
        type: string
      intake_artifact_id:
        description: Approved digiforge-printify-update-intake artifact ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: printify-exact-artifact-audit
  cancel-in-progress: false
jobs:
  protections:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require configured independent approval controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 bin/artifact-audit/control.py environments
  audit:
    needs: protections
    environment: printify-artifact-intake
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticate and validate approved intake metadata
        env:
          GH_TOKEN: ${{ github.token }}
          INTAKE_RUN: ${{ inputs.intake_run_id }}
          INTAKE_ARTIFACT: ${{ inputs.intake_artifact_id }}
        run: |
          mkdir -p results
          python3 bin/artifact-audit/control.py intake-approval > results/intake-approval.json
          python3 bin/artifact-audit/control.py intake "$INTAKE_RUN" "$INTAKE_ARTIFACT" > results/intake.json
          gh api "repos/subvicco12/digiforge/actions/artifacts/$INTAKE_ARTIFACT/zip" > intake-wrapper.zip
      - name: Verify exact digest and all members before extraction
        run: |
          python3 bin/artifact-audit/control.py unwrap intake-wrapper.zip candidate.zip
          python3 bin/artifact-audit/verify.py candidate.zip docs/engineering/printify-artifact-audit/preservation-manifest.json extracted > results/admission.json
      - name: Existing security gates with narrow pinned Drive review
        run: python3 bin/artifact-audit/security.py extracted/digiforge > results/security.json
      - name: Prepare isolated test tools and disposable WordPress fixture
        run: docker build -f bin/artifact-audit/Dockerfile -t printify-artifact-audit .
      - name: Audit extracted ZIP contents with no external network
        run: |
          docker run --rm --network none --cap-drop ALL --cap-add SETUID --cap-add SETGID --cap-add DAC_OVERRIDE --cap-add CHOWN --pids-limit 256 --memory 3g --cpus 2 -v "$PWD/extracted:/artifact:ro" -v "$PWD/results:/results" printify-artifact-audit
      - name: Bind completed tests to exact ZIP and audit source
        env:
          AUDIT_SOURCE_SHA: ${{ github.sha }}
        run: |
          sha256sum candidate.zip > results/exact-zip.sha256
          python3 -c 'import json,os;json.dump({"artifact_sha256":"aba29f64dd0a874635098492c4073012d219a404c676e2b237a346c6495b43e1","audit_source_sha":os.environ["AUDIT_SOURCE_SHA"],"production_activation_authorized":False,"independent_acceptance":"PENDING"},open("results/receipt.json","w"))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: printify-artifact-audit-evidence
          path: results/
          if-no-files-found: error
          retention-days: 14
  independent-acceptance:
    needs: audit
    environment: printify-artifact-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require recorded independent intake and post-result approvals
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 bin/artifact-audit/control.py acceptance > independent-acceptance.json
      - uses: actions/upload-artifact@v4
        with:
          name: printify-artifact-independent-acceptance
          path: independent-acceptance.json
          retention-days: 14
