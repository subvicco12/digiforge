name: DigiForge Engineering and Safety Audit

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'build/**'
      - 'phase-**'
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digiforge-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engineering-safety-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: docker.io/library/mariadb:10.11@sha256:7db29378d4fdab73f8123bbc2b48905c90d1a4b00cf848b028f1e81e623257f2
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: digiforge_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Validate Composer manifest
        run: composer validate --strict --no-check-lock

      - name: Install quality tools
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit installed Composer dependency advisories
        run: composer audit --no-interaction

      - name: PHP syntax checks
        shell: bash
        run: |
          set +e
          status=0
          while IFS= read -r -d '' file; do
            echo "Linting $file"
            php -l "$file" || status=1
          done < <(find . -name '*.php' -not -path './.git/*' -not -path './vendor/*' -print0)
          exit "$status"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bounded document text verifier dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends poppler-utils
          /usr/bin/pdftotext -v

      - name: Install pinned offline cutout processor
        run: |
          python3 -m venv /tmp/digiforge-cutout-runtime
          /tmp/digiforge-cutout-runtime/bin/pip install --disable-pip-version-check -r includes/POD/offline/requirements.txt
          echo "DIGIFORGE_CUTOUT_PYTHON=/tmp/digiforge-cutout-runtime/bin/python" >> "$GITHUB_ENV"
          site_path=$(/tmp/digiforge-cutout-runtime/bin/python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')
          echo "PYTHONPATH=$site_path" >> "$GITHUB_ENV"

      - name: Audit offline processor dependency advisories
        run: |
          python3 bin/audit-cutout-dependencies.py
          python3 bin/audit-cutout-dependencies.py --sam-matting

      - name: Legacy and unit tests
        run: composer test

      - name: Experimental matting boundary static analysis
        run: vendor/bin/phpstan analyse --level=0 --no-progress includes/POD/ExperimentalMattingPipeline.php includes/POD/OfflineCutoutPipeline.php includes/POD/RasterArtworkCodec.php includes/POD/CutoutVisualQa.php

      - name: Printify preview offline smoke tests
        run: |
          php -d zend.assertions=1 -d assert.exception=1 tests/printify-catalog-preview-smoke.php
          php tests/printify-catalog-read-policy-smoke.php
          php tests/printify-catalog-attempt-authorization-smoke.php

      - name: Offline catalog and recovery evidence regression tests
        run: python3 -m unittest discover -s tests/offline -p 'test_*.py' -v

      - name: Install WordPress integration fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq subversion default-mysql-client
          bash bin/install-wp-tests.sh digiforge_tests root root 127.0.0.1:3306 latest

      - name: External document admission focused regression tests
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: vendor/bin/phpunit --configuration phpunit.wordpress.xml.dist --filter 'ExternalDocument(Admission|ListingIntegrity)Test'

      - name: Website explicit owner access focused security tests
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: vendor/bin/phpunit --configuration phpunit.wordpress.xml.dist --filter 'WebsiteOwnerAccessTest|ShopAccess(Acceptance|RevocationIntegrity|RestAcceptance|WorkflowAcceptance)Test'

      - name: Prepare Google portal capture directory
        run: mkdir -p "$RUNNER_TEMP/google-portal-fixtures"

      - name: WordPress database integration tests
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
          DF_GOOGLE_PORTAL_FIXTURES: ${{ runner.temp }}/google-portal-fixtures
        run: composer test:wordpress

      - name: Set up Node for offline portal acceptance
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Google portal offline fixture browser acceptance
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/google-portal-browser-cache
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/google-portal-browser"
          npm install --prefix "$runtime" --ignore-scripts --save-exact playwright@1.62.1
          npm audit --prefix "$runtime" --omit=dev --audit-level=high
          node "$runtime/node_modules/playwright/cli.js" install --with-deps chromium
          NODE_PATH="$runtime/node_modules" node tests/browser/google-drive-portal.cjs "$RUNNER_TEMP/google-portal-fixtures"

      - name: Official Action Scheduler integration acceptance
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/action-scheduler-3.9.3.tar.gz"
          curl --fail --location --silent --show-error https://github.com/woocommerce/action-scheduler/archive/refs/tags/3.9.3.tar.gz --output "$archive"
          echo "5072f65ea3507d91fe731e716e85380dc5c771df7bdf09c60235d2ded1816240  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          export DIGIFORGE_TEST_ACTION_SCHEDULER_DIR="$RUNNER_TEMP/action-scheduler-3.9.3"
          vendor/bin/phpunit --configuration phpunit.wordpress.xml.dist --bootstrap tests/integration/action-scheduler/bootstrap.php tests/integration/action-scheduler/ActionSchedulerAcceptanceTest.php

      - name: Git diff check
        run: git diff --check

      - name: Legacy FIELDORA scan
        run: |
          if grep -Rni --exclude-dir=.git --exclude-dir=vendor --exclude='digiforge-foundation-audit.yml' 'fieldora' .; then
            echo 'Legacy FIELDORA identifier found'
            exit 1
          fi

      - name: Secret-pattern scan
        shell: bash
        env:
          SECRET_PATTERN: >-
            (api[_-]?key|secret|password|access[_-]?token|refresh[_-]?token|client[_-]?secret)[[:space:]]*[:=][[:space:]]*["'][^"']{20,}["']
        run: |
          set -e
          if grep -RniE --exclude-dir=.git --exclude-dir=vendor --exclude='digiforge-foundation-audit.yml' --include='*.php' "$SECRET_PATTERN" digiforge.php includes modules automation admin; then
            echo 'Potential hard-coded credential found'
            exit 1
          fi

      - name: Complete candidate-history credential scan
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks-8.30.1.tar.gz"
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          export DIGIFORGE_TEST_GITLEAKS="$RUNNER_TEMP/gitleaks"
          python3 -m unittest discover -s tests/security -p 'test_repository_credentials.py'
          python3 bin/check-repository-credentials.py --scanner "$DIGIFORGE_TEST_GITLEAKS" --report "$RUNNER_TEMP/digiforge-repository-credential-evidence.json"

      - name: Google HTTP boundary scanner regressions
        run: python3 -m unittest discover -s tests/security -p 'test_google_http_boundary.py'

      - name: External HTTP client scan
        shell: bash
        run: |
          set -e
          if grep -RniE --exclude-dir=.git --exclude-dir=vendor --exclude='digiforge-foundation-audit.yml' --exclude='HostingerRecoveryProvider.php' --exclude='ConnectionTester.php' --exclude='RecoveryStagingClient.php' --exclude='EtsySellerTaxonomyClient.php' --exclude='EtsyOAuth.php' --exclude='EtsyTokenManager.php' --exclude='EtsyControlledHttpExecutor.php' --exclude='OpenAIClient.php' --exclude='PrintifyCatalogClient.php' --exclude='PrintifyControlledTransport.php' --exclude='PrintifyReconciliationLookup.php' --exclude='GelatoCatalogClient.php' '(wp_remote_(get|post|request|head)|curl_init|GuzzleHttp|Requests\\)' digiforge.php includes modules automation admin | grep -vE '^includes/DigitalFactory/DriveWordPressGoogleHttp[.]php:[0-9]+:[[:space:]]*\$response=wp_remote_request\(\$url,\$args\);$'; then
            echo 'Unexpected external HTTP client usage found outside audited integration clients'
            exit 1
          fi
          # One exact Google sender line; all other paths/calls remain globally denied.
          test "$(grep -c 'wp_remote_request(' includes/DigitalFactory/DriveWordPressGoogleHttp.php)" -eq 1
          ! grep -nE '(wp_remote_(get|post|head)|curl_init|GuzzleHttp|Requests\\\\)' includes/DigitalFactory/DriveWordPressGoogleHttp.php
          grep -Fq '!self::valid($url,$args)||!$this->gate->allows($binding)' includes/DigitalFactory/DriveWordPressGoogleHttp.php
          grep -Fq "(\$args['sslverify']??null)!==true" includes/DigitalFactory/DriveWordPressGoogleHttp.php
          grep -Fq "(\$args['redirection']??null)!==0" includes/DigitalFactory/DriveWordPressGoogleHttp.php
          grep -Fq "(\$args['reject_unsafe_urls']??null)!==true" includes/DigitalFactory/DriveWordPressGoogleHttp.php
          grep -Fq "\$args['limit_response_size']>10000001" includes/DigitalFactory/DriveWordPressGoogleHttp.php
          grep -Fq "\$host==='oauth2.googleapis.com'" includes/DigitalFactory/DriveWordPressGoogleHttp.php
          grep -Fq "\$host!=='www.googleapis.com'" includes/DigitalFactory/DriveWordPressGoogleHttp.php
          grep -Fq "\$args['cookies']=[]" includes/DigitalFactory/DriveWordPressGoogleHttp.php
          test "$(grep -c 'wp_remote_post(' includes/Operations/HostingerRecoveryProvider.php)" -eq 1
          ! grep -nE '(wp_remote_(get|request|head)|curl_init|GuzzleHttp|Requests\\)' includes/Operations/HostingerRecoveryProvider.php
          grep -Fq 'https://developers.hostinger.com/api/hosting/v1' includes/Operations/HostingerRecoveryProvider.php
          grep -Fq "'redirection' => 0" includes/Operations/HostingerRecoveryProvider.php
          grep -Fq "'sslverify' => true" includes/Operations/HostingerRecoveryProvider.php
          grep -Fq "'reject_unsafe_urls' => true" includes/Operations/HostingerRecoveryProvider.php
          grep -Fq 'RecoveryOrchestrator::dispatchClaimMatches' includes/Operations/HostingerRecoveryProvider.php
          grep -Fq 'RecoveryOrchestrator::safetyLocked()' includes/Operations/HostingerRecoveryProvider.php
          grep -Fq 'CredentialVault::decrypt' includes/Operations/HostingerRecoveryProvider.php
          grep -Fq 'RecoveryDispatchLedger::insert($dispatchOption' includes/Operations/HostingerRecoveryProvider.php
          test "$(grep -c 'wp_remote_request' includes/Listings/EtsyControlledHttpExecutor.php)" -eq 1
          grep -Fq "https://openapi.etsy.com/v3" includes/Listings/EtsyControlledHttpExecutor.php
          grep -Fq "'redirection'=>0" includes/Listings/EtsyControlledHttpExecutor.php
          grep -Fq "'sslverify'=>true" includes/Listings/EtsyControlledHttpExecutor.php
          grep -Fq 'EtsyLiveTransportInterlock::authorize' includes/Listings/EtsyControlledHttpExecutor.php
          grep -Fq 'EtsyScopedCredentialRetriever' includes/Listings/EtsyControlledHttpExecutor.php
          test "$(grep -c 'wp_remote_get' includes/Integrations/EtsySellerTaxonomyClient.php)" -eq 1
          ! grep -nE '(wp_remote_(post|request|head)|curl_init|GuzzleHttp|Requests\\)' includes/Integrations/EtsySellerTaxonomyClient.php
          grep -Fq "https://api.etsy.com/v3/application/seller-taxonomy/nodes" includes/Integrations/EtsySellerTaxonomyClient.php
          grep -Fq "'redirection'=>0" includes/Integrations/EtsySellerTaxonomyClient.php
          grep -Fq "'sslverify'=>true" includes/Integrations/EtsySellerTaxonomyClient.php
          grep -Fq "'reject_unsafe_urls'=>true" includes/Integrations/EtsySellerTaxonomyClient.php
          grep -Fq 'EtsyReadOnlyCredentialEnvelope::forIntegration' includes/Integrations/EtsySellerTaxonomyClient.php
          grep -Fq 'EtsySellerTaxonomyVerifier::verify' includes/Integrations/EtsySellerTaxonomyClient.php
          test "$(grep -c 'wp_remote_get' includes/Integrations/ConnectionTester.php)" -eq 1
          test "$(grep -c 'wp_remote_request' includes/POD/PrintifyReconciliationLookup.php)" -eq 1
          grep -Fq "'method'=>'GET'" includes/POD/PrintifyReconciliationLookup.php
          grep -Fq "'redirection'=>0" includes/POD/PrintifyReconciliationLookup.php
          grep -Fq "'sslverify'=>true" includes/POD/PrintifyReconciliationLookup.php
          grep -Fq 'PrintifyScopedCredentialRetriever' includes/POD/PrintifyReconciliationLookup.php
          ! grep -nE '(wp_remote_(get|post|head)|curl_init|GuzzleHttp|Requests\\)' includes/POD/PrintifyReconciliationLookup.php
          test "$(grep -c 'wp_remote_request' includes/POD/PrintifyControlledTransport.php)" -eq 1
          grep -Fq "https://api.printify.com/v1" includes/POD/PrintifyControlledTransport.php
          grep -Fq "'redirection'=>0" includes/POD/PrintifyControlledTransport.php
          grep -Fq "'sslverify'=>true" includes/POD/PrintifyControlledTransport.php
          grep -Fq 'PrintifyLiveTransportInterlock::authorize' includes/POD/PrintifyControlledTransport.php
          grep -Fq 'PrintifyScopedCredentialRetriever' includes/POD/PrintifyControlledTransport.php
          ! grep -nE '(wp_remote_(get|post|head)|curl_init|GuzzleHttp|Requests\\)' includes/POD/PrintifyControlledTransport.php
          test "$(grep -c 'wp_remote_get' includes/POD/PrintifyCatalogClient.php)" -eq 1
          grep -Fq "https://product.gelatoapis.com/v3/" includes/POD/GelatoCatalogClient.php
          grep -Fq "'X-API-KEY'=>\$apiKey" includes/POD/GelatoCatalogClient.php
          grep -Fq "'redirection'=>0" includes/POD/GelatoCatalogClient.php
          grep -Fq "'sslverify'=>true" includes/POD/GelatoCatalogClient.php
          grep -Fq "'reject_unsafe_urls'=>true" includes/POD/GelatoCatalogClient.php
          grep -Fq "MAX_ATTEMPTS=3" includes/POD/GelatoCatalogClient.php
          grep -Fq "MAX_RETRY_AFTER_SECONDS=60" includes/POD/GelatoCatalogClient.php
          ! grep -nE '(wp_remote_(post|request|head)|curl_init|GuzzleHttp|Requests\\)' includes/POD/PrintifyCatalogClient.php
          grep -Fq "https://api.printify.com/" includes/POD/PrintifyCatalogClient.php
          grep -Fq "'redirection'=>0" includes/POD/PrintifyCatalogClient.php
          grep -Fq "'sslverify'=>true" includes/POD/PrintifyCatalogClient.php
          ! grep -nE '(wp_remote_(post|request|head)|curl_init|GuzzleHttp|Requests\\)' includes/Integrations/ConnectionTester.php
          grep -Fq "https://api.printify.com/v1/shops.json" includes/Integrations/ConnectionTester.php
          grep -Fq "https://api.etsy.com/v3/application/openapi-ping" includes/Integrations/ConnectionTester.php
          grep -Fq "https://api.etsy.com/v3/application/users/" includes/Integrations/ConnectionTester.php
          grep -Fq "https://product.gelatoapis.com/v3/catalogs" includes/Integrations/ConnectionTester.php
          grep -Fq "https://api.openai.com/v1/models" includes/Integrations/ConnectionTester.php
          grep -Fq "'redirection' => 0" includes/Integrations/ConnectionTester.php
          grep -Fq "'sslverify' => true" includes/Integrations/ConnectionTester.php
          grep -Fq "'reject_unsafe_urls' => true" includes/Integrations/ConnectionTester.php
          test "$(grep -c 'wp_remote_post' includes/Integrations/EtsyOAuth.php)" -eq 1
          ! grep -nE '(wp_remote_(get|request|head)|curl_init|GuzzleHttp|Requests\\)' includes/Integrations/EtsyOAuth.php
          grep -Fq "https://www.etsy.com/oauth/connect" includes/Integrations/EtsyOAuth.php
          grep -Fq "https://api.etsy.com/v3/public/oauth/token" includes/Integrations/EtsyOAuth.php
          grep -Fq "'redirection' => 0" includes/Integrations/EtsyOAuth.php
          grep -Fq "'sslverify' => true" includes/Integrations/EtsyOAuth.php
          grep -Fq "'reject_unsafe_urls' => true" includes/Integrations/EtsyOAuth.php
          grep -Fq "'code_challenge_method' => 'S256'" includes/Integrations/EtsyOAuth.php
          test "$(grep -c 'wp_remote_post' includes/Integrations/EtsyTokenManager.php)" -eq 1
          ! grep -nE '(wp_remote_(get|request|head)|curl_init|GuzzleHttp|Requests\\)' includes/Integrations/EtsyTokenManager.php
          grep -Fq "https://api.etsy.com/v3/public/oauth/token" includes/Integrations/EtsyTokenManager.php
          grep -Fq "'redirection' => 0" includes/Integrations/EtsyTokenManager.php
          grep -Fq "'sslverify' => true" includes/Integrations/EtsyTokenManager.php
          grep -Fq "'reject_unsafe_urls' => true" includes/Integrations/EtsyTokenManager.php
          test "$(grep -c 'wp_remote_post' includes/Launch/OpenAIClient.php)" -eq 3
          test "$(grep -c 'wp_remote_get' includes/Launch/OpenAIClient.php)" -eq 1
          ! grep -nE '(wp_remote_(request|head)|curl_init|GuzzleHttp|Requests\\)' includes/Launch/OpenAIClient.php
          grep -Fq "https://api.openai.com/v1/responses" includes/Launch/OpenAIClient.php
          grep -Fq "'redirection' => 0" includes/Launch/OpenAIClient.php
          grep -Fq "'sslverify' => true" includes/Launch/OpenAIClient.php
          grep -Fq "'reject_unsafe_urls' => true" includes/Launch/OpenAIClient.php

      - name: Build reproducible plugin package
        run: bash bin/package-plugin.sh

      - name: Verify package boundaries
        env:
          DIGIFORGE_EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -e
          unzip -l build/digiforge.zip > build/package-files.txt
          grep -q 'digiforge/digiforge.php' build/package-files.txt
          grep -q 'digiforge/uninstall.php' build/package-files.txt
          grep -q 'digiforge/includes/ProductFactory/ExternalDocumentAdmission.php' build/package-files.txt
          grep -q 'digiforge/includes/ProductFactory/ExternalDocumentRevision.php' build/package-files.txt
          grep -q 'digiforge/includes/ProductFactory/offline/verify_external_document.py' build/package-files.txt
          ! grep -Eq '(^|/)(vendor|tests|docs|\.github|bin)/' build/package-files.txt
          (cd build && sha256sum --check digiforge.zip.sha256)
          test -s build/digiforge.release-manifest.json
          php -r '$m=json_decode(file_get_contents("build/digiforge.release-manifest.json"),true); if(!is_array($m) || ($m["artifact"]??"")!=="digiforge.zip" || ($m["commit_sha"]??"")!==getenv("DIGIFORGE_EXPECTED_CANDIDATE_SHA") || ($m["external_actions_performed"]??true)!==false || ($m["production_activation_authorized"]??true)!==false){exit(1);}'

      - name: Upload audited package
        uses: actions/upload-artifact@v4
        with:
          name: digiforge-plugin-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/digiforge.zip
            build/digiforge.zip.sha256
            build/digiforge.release-manifest.json
          if-no-files-found: error
          retention-days: 14
